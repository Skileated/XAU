# ==============================================================================
# Research Configuration
# Focus: Reproducibility, deterministic pipelines, rich experimentation audits
# ==============================================================================
environment: research
project_name: xau-quant-platform
version: "0.1.0"

logging:
  level: "${LOG_LEVEL:-INFO}"
  format: "${LOG_FORMAT:-text}"
  max_bytes: 20971520 # 20MB
  backup_count: 10
  enable_console: true
  enable_file: true

storage:
  engine: duckdb
  database_filename: xau_research.duckdb
  memory_limit: 4GB

data:
  primary_symbol: XAUUSD
  base_currency: XAU
  quote_currency: USD
  timezone: UTC

custom:
  random_seed: 42
  track_reproducibility: true
