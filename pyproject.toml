[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xau-quant-platform"
version = "0.1.0"
description = "XAUUSD Quantitative Strategy Discovery and Decision Platform"
readme = "README.md"
authors = [
    { name = "Nishant" }
]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "duckdb>=1.0.0",
    "websockets>=13.0.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
xau = "xau_quant.cli:main"
xau-health = "xau_quant.cli:health_cmd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "network: marks tests requiring external live network access (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
